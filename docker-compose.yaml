version: "3.8"

networks:
  grid:
    driver: bridge

services:
  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub-from-DockerFile
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    networks:
      - grid

  chrome:
    image: selenium/node-chrome:latest
    depends_on:
      - selenium-hub
    shm_size: "2gb"
	deploy:
	  replicas: 4
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
	  - SE_NODE_OVERRIDE_MAX_SESSIONS=true
	  - SE_NODE_MAX_SESSIONS=4
   
    networks:
      - grid


  firefox:
    image: selenium/node-firefox:latest
    depends_on:
      - selenium-hub
    shm_size: "2gb"
	deploy:
	  replicas: 4
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
	  - SE_NODE_OVERRIDE_MAX_SESSIONS=true
	  - SE_NODE_MAX_SESSIONS=4
    networks:
      - grid
